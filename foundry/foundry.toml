[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.20"

# Test settings
[profile.test]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
# Run all tests with full verbosity and gas reporting
verbosity = 2
gas_reports = ["Escrow", "IdentityRegistry", "MilestoneManager", "MockYieldRouter", "YieldManager"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

